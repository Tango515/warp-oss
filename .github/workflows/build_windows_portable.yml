name: Build Windows Portable

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or SHA to build
        required: true
        default: release/zh-local-ai
        type: string
      channel:
        description: Release channel to package
        required: true
        default: oss
        type: choice
        options:
          - oss
          - local
          - dev
          - preview
          - stable
      arch:
        description: Windows architecture
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64
      debug_build:
        description: Build a debug portable package
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Build portable package
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Prepare environment
        uses: ./.github/actions/prepare_environment
        with:
          target_os: windows
          is_self_hosted: false
          cache_key: windows-portable-${{ inputs.arch }}
          install_release_deps: true

      - name: Add arm64 target
        if: ${{ inputs.arch == 'arm64' }}
        run: rustup target add aarch64-pc-windows-msvc
        shell: bash

      - name: Build portable package
        shell: pwsh
        run: |
          $PackageArgs = @{
            CHANNEL = '${{ inputs.channel }}'
            ARCH = '${{ inputs.arch }}'
          }
          if ('${{ inputs.debug_build }}' -eq 'true') {
            $PackageArgs.DEBUG_BUILD = $true
          }
          ./script/windows/package_portable.ps1 @PackageArgs

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: WarpOss-Portable-Windows-${{ inputs.arch }}
          path: dist/*.zip
          if-no-files-found: error
